  <!-- 碗内身 -->
  <ellipse cx="90" cy="94" rx="48" ry="29" fill="#D8E9D0"/>
  <!-- 碗底阴影 -->
  <ellipse cx="90" cy="94" rx="42" ry="24" fill="#FFF9EF"/>
  <!-- 勺子把 -->
  <line x1="122" y1="50" x2="82" y2="96" stroke="#F5C98E" stroke-width="8" stroke-linecap="round"/>
  <!-- 勺子头 -->
  <ellipse cx="131" cy="42" rx="14" ry="10" fill="#FFE2C5" transform="rotate(-28,131,42)"/>
  <!-- 食物 -->
  <circle cx="75" cy="95" r="6" fill="#F5C98E"/>
  <circle cx="90" cy="90" r="5" fill="#F5C98E"/>
  <circle cx="105" cy="96" r="6" fill="#F5C98E"/>
  <!-- 蒸汽 -->
  <path d="M68 58 Q64 48 68 38" stroke="#8FAE7A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M82 55 Q78 45 82 35" stroke="#8FAE7A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M96 58 Q92 48 96 38" stroke="#8FAE7A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 文字 -->
  <text x="90" y="160" text-anchor="middle" font-size="17" fill="#5A4A3A" font-weight="bold" font-family="PingFang SC,Microsoft YaHei,sans-serif">汐汐辅食</text>
</svg>
